---
author: "@eaglstun"

# macOS widget look: lock-screen clock over the wallpaper, frosted-glass panels, San Francisco text.
# In the native macOS menu bar app (macos/), the MACOS section below swaps background.png for the current desktop
# wallpaper, draws every font in the system font at the same weight and uses the system accent color.
# It also replaces the CPU usage bar with a per-core grid (CORE_GRID).
# The Python app ignores that section and shows the same layout with background.png, Roboto and blue.
display:
  DISPLAY_SIZE: 3.5"
  DISPLAY_ORIENTATION: portrait
  DISPLAY_RGB_LED: 10, 132, 255

  MACOS:
    WALLPAPER: background.png
    SYSTEM_FONTS: true
    ACCENT_COLOR: 10, 132, 255
    WALLPAPER_DIM: 0.3
    PANEL_BLUR: 10
    PANEL_TINT: 24, 24, 28
    PANEL_OPACITY: 0.62
    PANEL_RADIUS: 18
    PANEL_BORDER_OPACITY: 0.14
    PANELS:
      CPU: { X: 12, Y: 118, WIDTH: 142, HEIGHT: 112 }
      GPU: { X: 166, Y: 118, WIDTH: 142, HEIGHT: 112 }
      MEMORY: { X: 12, Y: 242, WIDTH: 142, HEIGHT: 112 }
      DISK: { X: 166, Y: 242, WIDTH: 142, HEIGHT: 112 }
      NETWORK: { X: 12, Y: 366, WIDTH: 296, HEIGHT: 102 }
    TRACK_COLOR: 255, 255, 255
    TRACK_OPACITY: 0.16
    TRACKS:
      CPU: { X: 26, Y: 198, WIDTH: 114, HEIGHT: 6 }
      GPU: { X: 180, Y: 198, WIDTH: 114, HEIGHT: 6 }
      MEMORY: { X: 26, Y: 322, WIDTH: 114, HEIGHT: 6 }
      DISK: { X: 180, Y: 322, WIDTH: 114, HEIGHT: 6 }
    # One bar per CPU core (E cores, then each P cluster) in place of the CPU usage bar. P cores use the accent color.
    CORE_GRID:
      X: 26
      Y: 186
      WIDTH: 114
      HEIGHT: 18
      E_COLOR: 235, 235, 240
      GAP: 2
      CLUSTER_GAP: 4
      REPLACES_TRACK: CPU
      BACKGROUND_IMAGE: background.png

